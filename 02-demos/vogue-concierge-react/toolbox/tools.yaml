# NOTE: replace every "your-gcp-project-id" below with your GCP project id
# (the `project:` field and the fully-qualified table names in each statement).
kind: sources
name: vogue-bq
type: bigquery
project: your-gcp-project-id
---
kind: tools
name: check_inventory
type: bigquery-sql
source: vogue-bq
description: >
  Check real-time inventory levels for a product by SKU.
  Returns stock quantities per size and total available units.
  Use when a customer asks about availability, sizes in stock, or whether an item is available.
parameters:
  - name: sku
    type: string
    description: The product SKU to check inventory for (e.g. SKU-001)
statement: |
  SELECT sku, product_name, size, quantity_in_stock, price,
    CASE WHEN quantity_in_stock < 5 THEN true ELSE false END AS low_stock
  FROM `your-gcp-project-id.vogue_concierge.inventory`
  WHERE sku = @sku
  ORDER BY size
---
kind: tools
name: get_loyalty_discount
type: bigquery-sql
source: vogue-bq
description: >
  Look up a customer's loyalty program status and available discount.
  Returns their tier, discount percentage, points balance, and free shipping status.
  Use when a customer asks about their membership, loyalty status, or discount eligibility.
parameters:
  - name: customer_id
    type: string
    description: The customer ID to look up (e.g. CUST-1042)
statement: |
  SELECT customer_id, customer_name, tier, discount_percent,
    points_balance, free_shipping, member_since
  FROM `your-gcp-project-id.vogue_concierge.loyalty_program`
  WHERE customer_id = @customer_id
---
kind: toolsets
name: default
tools:
  - check_inventory
  - get_loyalty_discount
